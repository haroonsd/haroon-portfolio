<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Haroon Siddiqui | Marketing Operations</title>
    <meta name="description" content="Haroon Siddiqui - Marketing operations professional with 5+ years across retail marketing, events, and AI-assisted tool building. Based in Toronto, Canada." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Syne+Mono&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>

  <body>
    <!-- Hidden form for Netlify Forms detection at build time -->
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" style="display:none">
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
